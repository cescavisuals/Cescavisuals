<!DOCTYPE html>
<html>
<head>
<title>Cescavisuals</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: black;
color: white;
}

h1 {
text-align: center;
font-size: 50px;
margin: 30px 0;
font-weight: bold;
letter-spacing: 2px;
}

.gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 10px;
padding: 10px;
}

.gallery img {
width: 100%;
height: auto;
filter: grayscale(100%);
transition: 0.3s;
}

.gallery img:hover {
filter: grayscale(0%);
transform: scale(1.03);
}

.contact {
text-align: center;
padding: 40px 20px;
border-top: 1px solid white;
margin-top: 20px;
}

.contact h2 {
margin-bottom: 20px;
}

.contact p {
margin: 8px 0;
font-size: 16px;
}

a {
color: white;
text-decoration: none;
}

a:hover {
text-decoration: underline;
}
</style>
</head>

<body>

<h1>Cescavisuals</h1>

<div class="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
</div>

<div class="contact">
<h2>Contact</h2>
<p>Instagram: <a href="https://instagram.com/cescavisuals" target="_blank">@cescavisuals</a></p>
<p>TikTok: <a href="https://tiktok.com/@cescavisuals" target="_blank">@cescavisuals</a></p>
<p>Email: <a href="mailto:fcphotog999@gmail.com">fcphotog999@gmail.com</a></p>
</div>

</body>
</html>
